<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vibe Image Comparator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Vibe Image Comparator</h1>
                <p class="subtitle">Find duplicate images using perceptual hashing</p>
            </header>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('scan')">Scan Folders</button>
                <button class="tab" onclick="switchTab('matches')">View Cached Matches</button>
            </div>

            <div id="scan-tab" class="tab-content">
                <div id="config-info" class="config-info">
                    <h3>Current Configuration</h3>
                    <div id="config-details"></div>
                </div>

                <form id="scan-form">
                    <div class="form-group">
                        <label for="scan-paths">Folder Paths to Scan (one per line):</label>
                        <textarea id="scan-paths" placeholder="/path/to/images&#10;/another/path/to/scan" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="scan-threshold">Similarity Threshold (0-64, lower = more similar):</label>
                            <input type="number" id="scan-threshold" min="0" max="64" placeholder="Leave empty to use config default">
                        </div>
                        <div class="form-group">
                            <label for="scan-grid-size">Hash Grid Size (e.g., 64 for 64x64):</label>
                            <input type="number" id="scan-grid-size" min="8" max="256" placeholder="Leave empty to use config default">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="include-hidden">
                                <label for="include-hidden">Include hidden directories</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="debug-mode">
                                <label for="debug-mode">Debug mode</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="skip-validation">
                                <label for="skip-validation">Skip file validation</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="scan-btn">Start Scan</button>
                </form>

                <div id="scan-loading" class="loading">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="scan-progress-fill"></div>
                        </div>
                        <div class="progress-text" id="scan-progress-text">Initializing...</div>
                    </div>
                </div>
            </div>

            <div id="matches-tab" class="tab-content" style="display: none;">
                <div class="controls-row">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="matches-threshold">Similarity Threshold:</label>
                            <input type="number" id="matches-threshold" min="0" max="64" placeholder="Config default">
                        </div>
                        <div class="form-group">
                            <label for="sort-by">Sort by:</label>
                            <select id="sort-by">
                                <option value="group-desc">Group Size (Largest First)</option>
                                <option value="group-asc">Group Size (Smallest First)</option>
                                <option value="name-asc">Group Name (A-Z)</option>
                            </select>
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="button" class="btn" onclick="loadMatches()">Reload Matches</button>
                        <button type="button" class="btn btn-secondary" onclick="exportMatches()">Export JSON</button>
                    </div>
                </div>

                <div id="matches-loading" class="loading show">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="matches-progress-fill" style="width: 100%; animation: pulse 1.5s infinite;"></div>
                        </div>
                        <div class="progress-text">Loading cached duplicate matches...</div>
                    </div>
                </div>
            </div>

            <div id="results" class="results hide">
                <div class="results-header">
                    <div id="results-summary"></div>
                    <div class="results-actions">
                        <button class="btn btn-small btn-secondary" onclick="expandAllGroups()">Expand All</button>
                        <button class="btn btn-small btn-secondary" onclick="collapseAllGroups()">Collapse All</button>
                    </div>
                </div>
                <div id="results-content"></div>
            </div>

            <div class="keyboard-hints">
                <span class="hint"><kbd>Esc</kbd> Close modal</span>
                <span class="hint"><kbd>←</kbd> <kbd>→</kbd> Navigate groups</span>
            </div>

            <div id="image-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="modal-title">Compare Images</h2>
                        <div class="modal-actions">
                            <button class="btn btn-small btn-danger" onclick="deleteAllButOne()">Keep Only First</button>
                            <button class="close-btn" onclick="closeImageModal()">&times;</button>
                        </div>
                    </div>
                    <div id="image-comparison" class="image-comparison"></div>
                </div>
            </div>

            <div id="zoom-modal" class="modal">
                <div class="zoom-content">
                    <img id="zoomed-image" class="zoomed-image" src="" alt="Zoomed view">
                    <button class="close-btn zoom-close" onclick="closeZoomModal()">&times;</button>
                </div>
            </div>
        </div>

        <script>
        let currentConfig = {};
        let duplicateGroups = [];
        let currentGroupIndex = -1;
        let scanStartTime = null;

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 B';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds.toFixed(1)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}m ${secs}s`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();
            loadMatches();
        });

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                currentConfig = config;

                const configDetails = document.getElementById('config-details');
                configDetails.innerHTML = `
                    <div class="config-detail"><strong>Grid Size:</strong> ${config.grid_size}x${config.grid_size}</div>
                    <div class="config-detail"><strong>Threshold:</strong> ${config.threshold}</div>
                    <div class="config-detail"><strong>Database:</strong> ${config.database_path || 'Default XDG cache location'}</div>
                `;
            } catch (error) {
                console.error('Failed to load config:', error);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            document.getElementById('scan-tab').style.display = tabName === 'scan' ? 'block' : 'none';
            document.getElementById('matches-tab').style.display = tabName === 'matches' ? 'block' : 'none';

            document.getElementById('results').classList.add('hide');
        }

        document.getElementById('scan-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const paths = document.getElementById('scan-paths').value.trim().split('\n').filter(p => p.trim());
            const threshold = document.getElementById('scan-threshold').value;
            const gridSize = document.getElementById('scan-grid-size').value;
            const includeHidden = document.getElementById('include-hidden').checked;
            const debug = document.getElementById('debug-mode').checked;
            const skipValidation = document.getElementById('skip-validation').checked;

            if (paths.length === 0) {
                showError('Please enter at least one path to scan.');
                return;
            }

            const scanBtn = document.getElementById('scan-btn');
            const loading = document.getElementById('scan-loading');
            const results = document.getElementById('results');
            const progressFill = document.getElementById('scan-progress-fill');
            const progressText = document.getElementById('scan-progress-text');

            scanBtn.disabled = true;
            loading.classList.add('show');
            results.classList.add('hide');

            progressFill.style.width = '0%';
            progressText.textContent = 'Scanning for images...';
            scanStartTime = Date.now();

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paths: paths,
                        threshold: threshold ? parseInt(threshold) : null,
                        grid_size: gridSize ? parseInt(gridSize) : null,
                        include_hidden: includeHidden,
                        debug: debug,
                        skip_validation: skipValidation,
                    }),
                });

                const result = await response.json();
                const elapsed = ((Date.now() - scanStartTime) / 1000).toFixed(1);

                progressFill.style.width = '100%';
                progressText.textContent = `Complete in ${elapsed}s`;

                if (result.success) {
                    showResults(result);
                } else {
                    showError('Scan failed: ' + result.message);
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                setTimeout(() => {
                    scanBtn.disabled = false;
                    loading.classList.remove('show');
                }, 1000);
            }
        });

        async function loadMatches() {
            const threshold = document.getElementById('matches-threshold').value;
            const loading = document.getElementById('matches-loading');
            const results = document.getElementById('results');

            loading.classList.add('show');
            results.classList.add('hide');

            try {
                const url = threshold ? `/api/matches?threshold=${threshold}&count=100` : '/api/matches?count=100';
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    showResults({
                        success: true,
                        message: `Found ${result.duplicates.length} duplicate sets from cache (threshold: ${result.threshold})`,
                        duplicate_count: result.duplicates.length,
                        duplicates: result.duplicates
                    });
                } else {
                    showError('Failed to load cached matches');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                loading.classList.remove('show');
            }
        }

        async function exportMatches() {
            const threshold = document.getElementById('matches-threshold').value;
            const url = threshold ? `/api/export?threshold=${threshold}` : '/api/export';

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    showError(`Export failed: ${response.status} ${response.statusText}`);
                    return;
                }
                const result = await response.json();

                if (result.success) {
                    const blob = new Blob([result.data], { type: 'application/json' });
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `duplicates-${new Date().toISOString().slice(0, 10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                } else {
                    showError('Failed to export matches');
                }
            } catch (error) {
                showError('Export error: ' + error.message);
            }
        }

        function sortGroups(groups) {
            const sortBy = document.getElementById('sort-by').value;
            const sorted = [...groups];

            switch (sortBy) {
                case 'group-desc':
                    return sorted.sort((a, b) => b.length - a.length);
                case 'group-asc':
                    return sorted.sort((a, b) => a.length - b.length);
                case 'name-asc':
                    return sorted.sort((a, b) => {
                        const nameA = a[0]?.path || '';
                        const nameB = b[0]?.path || '';
                        return nameA.localeCompare(nameB);
                    });
                default:
                    return sorted;
            }
        }

        function showResults(result) {
            const results = document.getElementById('results');
            const content = document.getElementById('results-content');
            const summary = document.getElementById('results-summary');

            duplicateGroups = sortGroups(result.duplicates || []);

            const totalFiles = duplicateGroups.reduce((sum, g) => sum + g.length, 0);
            summary.innerHTML = `
                <span class="summary-badge">${duplicateGroups.length} groups</span>
                <span class="summary-badge">${totalFiles} files</span>
            `;

            let html = `<div class="success">${result.message}</div>`;

            if (duplicateGroups.length > 0) {
                html += '<div class="groups-container">';
                duplicateGroups.forEach((group, index) => {
                    const groupSize = group.reduce((sum, f) => sum + (f.size || 0), 0);
                    html += `
                        <div class="duplicate-group" data-index="${index}">
                            <div class="group-header" onclick="toggleGroup(${index})">
                                <div class="group-title">
                                    <span class="group-number">Group ${index + 1}</span>
                                    <span class="group-count">${group.length} files</span>
                                    <span class="group-size">${formatFileSize(groupSize)}</span>
                                </div>
                                <div class="group-actions">
                                    <button class="btn btn-small btn-danger" onclick="event.stopPropagation(); deleteGroupFiles(${index})" title="Delete all files in this group">
                                        Delete All
                                    </button>
                                    <button class="btn btn-small" onclick="event.stopPropagation(); keepOnlyFirst(${index})" title="Keep only the first file">
                                        Keep First
                                    </button>
                                    <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); loadGroupThumbnails(${index})" title="Load preview thumbnails">
                                        Preview
                                    </button>
                                    <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); openImageComparison(${index})" title="Compare images">
                                        Compare
                                    </button>
                                    <span class="expand-icon" id="expand-icon-${index}">▼</span>
                                </div>
                            </div>
                            <div class="group-content" id="group-content-${index}" style="display: none;">
                                <ul class="file-list">
                                    ${group.map((file, fileIndex) => `
                                        <li class="${file.exists === false ? 'file-missing' : ''}">
                                            <span class="file-path">${file.path}</span>
                                            <span class="file-meta">
                                                ${file.exists === false ? '<span class="missing-indicator">MISSING</span>' : ''}
                                                ${file.size ? formatFileSize(file.size) : ''}
                                            </span>
                                        </li>
                                    `).join('')}
                                </ul>
                                <div class="thumbnail-preview" id="thumbnails-${index}">
                                    <div class="thumbnail-placeholder">
                                        Click "Preview" to load thumbnails
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p class="no-results">No duplicate images found.</p>';
            }

            content.innerHTML = html;
            results.classList.remove('hide');
        }

        function toggleGroup(index) {
            const content = document.getElementById(`group-content-${index}`);
            const icon = document.getElementById(`expand-icon-${index}`);
            const isVisible = content.style.display !== 'none';

            content.style.display = isVisible ? 'none' : 'block';
            icon.textContent = isVisible ? '▶' : '▼';

            if (!isVisible) {
                loadGroupThumbnails(index);
            }
        }

        function expandAllGroups() {
            duplicateGroups.forEach((_, index) => {
                const content = document.getElementById(`group-content-${index}`);
                const icon = document.getElementById(`expand-icon-${index}`);
                if (content && icon) {
                    content.style.display = 'block';
                    icon.textContent = '▼';
                }
            });
        }

        function collapseAllGroups() {
            duplicateGroups.forEach((_, index) => {
                const content = document.getElementById(`group-content-${index}`);
                const icon = document.getElementById(`expand-icon-${index}`);
                if (content && icon) {
                    content.style.display = 'none';
                    icon.textContent = '▶';
                }
            });
        }

        async function loadGroupThumbnails(groupIndex) {
            if (!duplicateGroups[groupIndex]) return;
            const fileInfos = duplicateGroups[groupIndex];

            const paths = fileInfos.map(file => file.path);
            try {
                const response = await fetch('/api/check-files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paths: paths }),
                });

                if (response.ok) {
                    const result = await response.json();
                    const fileStatusMap = new Map();
                    result.files.forEach(file => {
                        fileStatusMap.set(file.path, file);
                    });

                    fileInfos.forEach((file, index) => {
                        const status = fileStatusMap.get(file.path);
                        if (status) {
                            file.exists = status.exists;
                            file.size = status.size;
                        }
                    });
                }
            } catch (error) {
                console.error('Error checking file existence:', error);
            }

            const thumbnailContainer = document.getElementById(`thumbnails-${groupIndex}`);
            if (!thumbnailContainer) return;

            thumbnailContainer.innerHTML = '';

            fileInfos.forEach((fileInfo, imageIndex) => {
                const thumbnailDiv = document.createElement('div');

                if (!fileInfo.exists) {
                    thumbnailDiv.className = 'thumbnail-missing';
                    thumbnailDiv.innerHTML = '📁';
                    thumbnailDiv.title = `File missing: ${fileInfo.path}`;
                    thumbnailContainer.appendChild(thumbnailDiv);
                    return;
                }

                thumbnailDiv.className = 'thumbnail-loading';
                thumbnailDiv.innerHTML = '⏳';
                thumbnailContainer.appendChild(thumbnailDiv);

                const img = new Image();

                img.onload = function() {
                    thumbnailDiv.className = 'thumbnail';
                    thumbnailDiv.innerHTML = '';
                    thumbnailDiv.appendChild(img);
                    thumbnailDiv.onclick = (e) => {
                        e.stopPropagation();
                        openImageComparison(groupIndex);
                    };
                };

                img.onerror = function() {
                    thumbnailDiv.className = 'thumbnail-error';
                    thumbnailDiv.innerHTML = '❌';
                    thumbnailDiv.title = `Failed to load: ${fileInfo.path}`;
                };

                img.className = 'thumbnail';
                const encodedPath = encodeURIComponent(fileInfo.path);
                img.src = `/api/image/${encodedPath}`;
            });
        }

        function openImageComparison(groupIndex) {
            if (!duplicateGroups[groupIndex]) return;
            currentGroupIndex = groupIndex;
            const fileInfos = duplicateGroups[groupIndex];

            const modal = document.getElementById('image-modal');
            const modalTitle = document.getElementById('modal-title');
            const imageComparison = document.getElementById('image-comparison');

            const totalGroups = duplicateGroups.length;
            const missingCount = fileInfos.filter(file => file.exists === false).length;
            modalTitle.textContent = `Compare Images - Group ${groupIndex + 1} of ${totalGroups}${missingCount > 0 ? ` (${missingCount} missing)` : ''}`;

            imageComparison.innerHTML = '';

            fileInfos.forEach((fileInfo, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';

                const imageContainer = document.createElement('div');
                imageContainer.className = 'image-container';

                if (fileInfo.exists === false) {
                    const missingDiv = document.createElement('div');
                    missingDiv.className = 'image-error';
                    missingDiv.innerHTML = `
                        <div>📁 File Missing</div>
                        <div class="error-path">${fileInfo.path}</div>
                    `;
                    imageContainer.appendChild(missingDiv);
                } else {
                    const loadingDiv = document.createElement('div');
                    loadingDiv.className = 'image-loading';
                    loadingDiv.textContent = '⏳ Loading...';
                    imageContainer.appendChild(loadingDiv);

                    loadImage(fileInfo.path, imageContainer);
                }

                const imageInfo = document.createElement('div');
                imageInfo.className = 'image-info';

                if (fileInfo.exists !== false) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'modal-delete-btn';
                    deleteBtn.textContent = '🗑️';
                    deleteBtn.title = 'Delete file';
                    deleteBtn.onclick = () => deleteFileFromModal(fileInfo.path, groupIndex, index);
                    imageInfo.appendChild(deleteBtn);
                }

                const filename = document.createElement('div');
                filename.className = `image-filename${fileInfo.exists === false ? ' file-missing' : ''}`;
                filename.textContent = fileInfo.path.split('/').pop();

                const details = document.createElement('div');
                details.className = `image-details${fileInfo.exists === false ? ' file-missing' : ''}`;

                let detailsHtml = `<div class="file-path">${fileInfo.path}</div>`;

                if (fileInfo.exists === false) {
                    detailsHtml += '<span class="missing-indicator">MISSING</span>';
                } else {
                    detailsHtml += `<div class="file-size">Size: ${formatFileSize(fileInfo.size)}</div>`;
                    if (fileInfo.hash) {
                        detailsHtml += `<div class="file-hash">Hash: <code>${fileInfo.hash}</code></div>`;
                    }
                }

                details.innerHTML = detailsHtml;

                imageInfo.appendChild(filename);
                imageInfo.appendChild(details);

                imageItem.appendChild(imageContainer);
                imageItem.appendChild(imageInfo);
                imageComparison.appendChild(imageItem);
            });

            modal.classList.add('show');
        }

        function loadImage(imagePath, container) {
            const img = new Image();

            img.onload = function() {
                container.innerHTML = '';
                img.className = 'comparison-image';
                img.onclick = () => openZoomModal(imagePath);
                container.appendChild(img);
            };

            img.onerror = function() {
                container.innerHTML = `
                    <div class="image-error">
                        <div>❌ Failed to load image</div>
                        <div class="error-path">${imagePath}</div>
                    </div>
                `;
            };

            const encodedPath = encodeURIComponent(imagePath);
            img.src = `/api/image/${encodedPath}`;
        }

        function openZoomModal(imagePath) {
            const modal = document.getElementById('zoom-modal');
            const img = document.getElementById('zoomed-image');
            img.src = `/api/image/${encodeURIComponent(imagePath)}`;
            modal.classList.add('show');
        }

        function closeZoomModal() {
            document.getElementById('zoom-modal').classList.remove('show');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.remove('show');
            currentGroupIndex = -1;
        }

        function navigateToGroup(newGroupIndex) {
            if (newGroupIndex < 0) {
                newGroupIndex = duplicateGroups.length - 1;
            } else if (newGroupIndex >= duplicateGroups.length) {
                newGroupIndex = 0;
            }

            if (duplicateGroups[newGroupIndex]) {
                openImageComparison(newGroupIndex);
            }
        }

        document.getElementById('image-modal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeImageModal();
            }
        });

        document.getElementById('zoom-modal').addEventListener('click', function(event) {
            if (event.target === this || event.target.id === 'zoomed-image') {
                closeZoomModal();
            }
        });

        document.addEventListener('keydown', function(event) {
            const imageModal = document.getElementById('image-modal');
            const zoomModal = document.getElementById('zoom-modal');
            const isImageModalOpen = imageModal.classList.contains('show');
            const isZoomModalOpen = zoomModal.classList.contains('show');

            if (isZoomModalOpen) {
                if (event.key === 'Escape') {
                    closeZoomModal();
                }
                return;
            }

            if (!isImageModalOpen) return;

            if (event.key === 'Escape') {
                closeImageModal();
            } else if (event.key === 'ArrowLeft') {
                navigateToGroup(currentGroupIndex - 1);
                event.preventDefault();
            } else if (event.key === 'ArrowRight') {
                navigateToGroup(currentGroupIndex + 1);
                event.preventDefault();
            }
        });

        async function deleteFileFromModal(filePath, groupIndex, fileIndex) {
            if (!confirm(`Delete file: ${filePath}?\n\nPress OK to delete.`)) {
                return;
            }

            try {
                const response = await fetch('/api/delete-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: filePath }),
                });

                const result = await response.json();

                if (result.success) {
                    duplicateGroups[groupIndex].splice(fileIndex, 1);

                    if (duplicateGroups[groupIndex].length === 0) {
                        duplicateGroups.splice(groupIndex, 1);
                        closeImageModal();
                    } else {
                        openImageComparison(groupIndex);
                    }

                    showResults({
                        success: true,
                        message: `File deleted. ${duplicateGroups.length} groups remaining.`,
                        duplicates: duplicateGroups
                    });
                } else {
                    showError(`Failed to delete file: ${result.message}`);
                }
            } catch (error) {
                showError(`Network error: ${error.message}`);
            }
        }

        async function keepOnlyFirst(groupIndex) {
            const group = duplicateGroups[groupIndex];
            if (!group || group.length <= 1) return;

            const fileToKeep = group[0];
            const filesToDelete = group.slice(1);
            const fileList = filesToDelete.map(f => f.path).join('\n');

            if (!confirm(`Keep only "${fileToKeep.path.split('/').pop()}" and delete these ${filesToDelete.length} files?\n\n${fileList}`)) {
                return;
            }

            let deleted = 0;
            let failed = 0;
            const failedFiles = [];

            for (const file of filesToDelete) {
                try {
                    const response = await fetch('/api/delete-file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: file.path }),
                    });
                    const result = await response.json();
                    if (result.success) {
                        deleted++;
                    } else {
                        failed++;
                        failedFiles.push(file.path);
                    }
                } catch (error) {
                    failed++;
                    failedFiles.push(file.path);
                }
            }

            duplicateGroups[groupIndex] = [fileToKeep, ...failedFiles.map(path => ({ path, exists: true, size: undefined }))];

            if (duplicateGroups[groupIndex].length < 2) {
                duplicateGroups.splice(groupIndex, 1);
            }

            if (failed > 0) {
                showError(`Failed to delete ${failed} files. They are still shown in the list.`);
            } else {
                showResults({
                    success: true,
                    message: `Deleted ${deleted} files. ${duplicateGroups.length} groups remaining.`,
                    duplicates: duplicateGroups
                });
            }

            if (duplicateGroups[groupIndex] && duplicateGroups[groupIndex].length >= 2) {
                openImageComparison(groupIndex);
            } else {
                closeImageModal();
            }
        }

        async function deleteGroupFiles(groupIndex) {
            const group = duplicateGroups[groupIndex];
            if (!group) return;

            if (!confirm(`Delete ALL ${group.length} files in this group?\n\nThis cannot be undone.`)) {
                return;
            }

            let deleted = 0;
            let failed = 0;
            const failedFiles = [];

            for (const file of group) {
                try {
                    const response = await fetch('/api/delete-file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: file.path }),
                    });
                    const result = await response.json();
                    if (result.success) {
                        deleted++;
                    } else {
                        failed++;
                        failedFiles.push(file);
                    }
                } catch (error) {
                    failed++;
                    failedFiles.push(file);
                }
            }

            if (failed > 0) {
                duplicateGroups[groupIndex] = failedFiles;
                showError(`Failed to delete ${failed} files. They remain in the group.`);
                openImageComparison(groupIndex);
            } else {
                duplicateGroups.splice(groupIndex, 1);
                showResults({
                    success: true,
                    message: `Deleted ${deleted} files. ${duplicateGroups.length} groups remaining.`,
                    duplicates: duplicateGroups
                });
                closeImageModal();
            }
        }

        function deleteAllButOne() {
            if (currentGroupIndex < 0 || !duplicateGroups[currentGroupIndex]) return;
            keepOnlyFirst(currentGroupIndex);
        }

        function showError(message) {
            const results = document.getElementById('results');
            const content = document.getElementById('results-content');
            const summary = document.getElementById('results-summary');

            summary.innerHTML = '';
            content.innerHTML = `<div class="error">${message}</div>`;
            results.classList.remove('hide');
        }
        </script>
    </body>
</html>
